<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informes Gerenciales - Gas Guainía MAF</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Librería nativa para generar archivos Word (.docx) reales -->
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f1f5f9; }
        .tab-btn { border-bottom: 3px solid transparent; transition: all 0.2s; }
        .tab-btn.active { border-bottom: 3px solid #1e3a8a; color: #1e3a8a; font-weight: 900; background-color: #eff6ff; }
        .hoja-carta {
            width: 100%;
            max-width: 816px; /* 8.5 pulgadas a 96dpi */
            background: #ffffff;
            margin: 0 auto;
            padding: 40px 44px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.12);
            border: 1px solid #e2e8f0;
        }
        #loader { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); z-index: 9999; justify-content: center; align-items: center; color: white; flex-direction: column; backdrop-filter: blur(4px); }
        .spinner { border: 4px solid rgba(255,255,255,0.2); border-radius: 50%; border-top: 4px solid #38bdf8; width: 54px; height: 54px; animation: spin 1s linear infinite; margin-bottom: 12px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-9 rounded-2xl shadow-2xl w-full max-w-sm text-center border-t-8 border-[#1e3a8a]">
            <div class="bg-blue-50 text-[#1e3a8a] w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">
                <i class="fas fa-file-word"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800">GAS GUAINÍA</h2>
            <p class="text-slate-500 mb-6 font-bold text-sm">Módulo de Informes Word (.docx)</p>
            <input type="password" id="login-pin" placeholder="PIN Administrador" class="w-full text-center text-3xl tracking-widest p-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl mb-5 focus:outline-none focus:border-[#1e3a8a]" autocomplete="off" onkeydown="if(event.key==='Enter') iniciarSesion()">
            <button onclick="iniciarSesion()" class="w-full bg-[#1e3a8a] hover:bg-blue-900 text-white font-black py-3.5 rounded-xl shadow-lg transition text-base">INGRESAR</button>
        </div>
    </div>

    <!-- LOADER -->
    <div id="loader">
        <div class="spinner"></div>
        <span id="loader-text" class="font-bold tracking-wide text-sm">Sincronizando base de datos...</span>
    </div>

    <!-- HEADER -->
    <header class="bg-[#0f172a] text-white px-6 py-4 flex flex-wrap justify-between items-center gap-4 shadow-md">
        <div class="flex items-center gap-3">
            <i class="fas fa-fire-flame-simple text-orange-400 text-2xl"></i>
            <div>
                <h1 class="text-xl font-black tracking-wide leading-tight">CENTRO DE INFORMES</h1>
                <p class="text-xs text-slate-400 font-bold">Gas Guainía • NIT 19001956-1 • Exportación Word Carta Vertical</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span id="user-info" class="text-xs font-bold bg-white/10 px-3 py-1.5 rounded-lg text-slate-200"></span>
            <button onclick="syncData(true)" class="bg-blue-600/30 hover:bg-blue-600/50 border border-blue-400/40 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition">
                <i class="fas fa-sync-alt mr-1"></i> Actualizar BD
            </button>
            <button onclick="cerrarSesion()" class="bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition">
                <i class="fas fa-power-off mr-1"></i> Salir
            </button>
        </div>
    </header>

    <!-- BARRA DE FILTROS Y DESCARGA -->
    <section class="bg-white border-b border-slate-200 shadow-sm px-6 py-4">
        <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-6 gap-3 items-end">
            <div>
                <label class="block text-[11px] font-black uppercase text-slate-500 mb-1">Fecha Desde</label>
                <input type="date" id="fecha-desde" class="w-full border border-slate-300 rounded-lg p-2 text-sm font-bold bg-slate-50">
            </div>
            <div>
                <label class="block text-[11px] font-black uppercase text-slate-500 mb-1">Fecha Hasta</label>
                <input type="date" id="fecha-hasta" class="w-full border border-slate-300 rounded-lg p-2 text-sm font-bold bg-slate-50">
            </div>
            <div>
                <label class="block text-[11px] font-black uppercase text-slate-500 mb-1">Elaborado por</label>
                <input type="text" id="firma-elabora" class="w-full border border-slate-300 rounded-lg p-2 text-sm font-bold bg-slate-50" placeholder="Nombre responsable">
            </div>
            <div>
                <label class="block text-[11px] font-black uppercase text-slate-500 mb-1">Revisado / Aprobado</label>
                <input type="text" id="firma-aprueba" class="w-full border border-slate-300 rounded-lg p-2 text-sm font-bold bg-slate-50" value="Miguel Ángel Forero Gaitán">
            </div>
            <div class="md:col-span-2 flex gap-2">
                <button onclick="procesarInformes()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-black py-2.5 px-4 rounded-lg text-sm shadow transition">
                    <i class="fas fa-filter mr-1"></i> Generar Vista
                </button>
                <button onclick="descargarWordActivo()" class="flex-1 bg-[#1e3a8a] hover:bg-blue-900 text-white font-black py-2.5 px-4 rounded-lg text-sm shadow transition">
                    <i class="fas fa-file-word mr-1"></i> Descargar Word
                </button>
            </div>
        </div>
    </section>

    <!-- SELECTOR DE INFORME -->
    <nav class="bg-white border-b border-slate-200 px-6 flex gap-2 justify-center">
        <button id="btn-tab-ventas" class="tab-btn active px-6 py-3 text-sm" onclick="cambiarTab('ventas')">
            <i class="fas fa-file-invoice-dollar mr-2"></i> 1. Consolidado de Ventas y Gastos
        </button>
        <button id="btn-tab-bodega" class="tab-btn px-6 py-3 text-sm" onclick="cambiarTab('bodega')">
            <i class="fas fa-boxes-stacked mr-2"></i> 2. Control e Inventario de Bodega
        </button>
    </nav>

    <!-- VISTA PREVIA EN FORMATO CARTA VERTICAL -->
    <main class="flex-1 p-6 overflow-y-auto">
        <div id="preview-ventas" class="hoja-carta"></div>
        <div id="preview-bodega" class="hoja-carta hidden"></div>
    </main>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzVebT-EsVILWNRSO_B6DlmVxdn-HrFOMJvsMmcXCcVJMOb_mVTbxLd8OQamD2Aq-ugPw/exec';
        let db = { usuarios: [], productos: [], movimientos: [], clientes: [], repartidores: [], gastos: [], ventas: [], creditos: [] };
        let currentUser = null;
        let tabActiva = 'ventas';
        let datosVentas = null;
        let datosBodega = null;

        const EMPRESA = {
            nombre: 'GAS GUAINÍA',
            grupo: 'Grupo Empresarial MAF',
            nit: 'NIT: 19001956-1',
            direccion: 'Km 1, Vía Aeropuerto - Piedra de Caño Conejo, Inírida, Guainía',
            telefono: 'Tel / WhatsApp: 313 470 1620'
        };

        const formMoneda = (val) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(Number(val) || 0);
        const soloFecha = (val) => { if (!val) return ''; return String(val).trim().substring(0, 10); };
        const hoyISO = () => { let d = new Date(); d.setHours(d.getHours() - 5); return d.toISOString().split('T')[0]; };

        function showLoader(msg = 'Cargando...') {
            document.getElementById('loader-text').innerText = msg;
            document.getElementById('loader').style.display = 'flex';
        }
        function hideLoader() { document.getElementById('loader').style.display = 'none'; }

        function cambiarTab(tab) {
            tabActiva = tab;
            document.getElementById('btn-tab-ventas').classList.toggle('active', tab === 'ventas');
            document.getElementById('btn-tab-bodega').classList.toggle('active', tab === 'bodega');
            document.getElementById('preview-ventas').classList.toggle('hidden', tab !== 'ventas');
            document.getElementById('preview-bodega').classList.toggle('hidden', tab !== 'bodega');
        }

        async function syncData(mostrarToast = false) {
            showLoader('Descargando datos en vivo...');
            try {
                let res = await fetch(API_URL + '?action=syncAll');
                let json = await res.json();
                if (json.status === 'ok') {
                    db = json;
                    if (currentUser) procesarInformes();
                    if (mostrarToast) Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Datos actualizados', showConfirmButton: false, timer: 1500 });
                } else {
                    Swal.fire('Error', json.message || 'No se pudo cargar la BD', 'error');
                }
            } catch (e) {
                Swal.fire('Error de conexión', 'Verifica internet o la URL del servidor.', 'error');
            }
            hideLoader();
        }

        function iniciarSesion() {
            let pin = document.getElementById('login-pin').value;
            if (!db.usuarios || db.usuarios.length === 0) return Swal.fire('Espera', 'Cargando base de datos...', 'info');
            let user = db.usuarios.find(u => String(u.pin) === String(pin) && u.rol === 'ADMIN' && u.activo === 'SI');
            if (!user) {
                document.getElementById('login-pin').value = '';
                return Swal.fire('Acceso denegado', 'PIN incorrecto o sin permisos ADMIN.', 'error');
            }
            currentUser = user;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('user-info').innerHTML = `<i class="fas fa-user-shield mr-1"></i> ${user.nombre}`;
            document.getElementById('firma-elabora').value = user.nombre;

            let hoy = hoyISO();
            let inicioMes = hoy.substring(0, 8) + '01';
            document.getElementById('fecha-desde').value = inicioMes;
            document.getElementById('fecha-hasta').value = hoy;
            procesarInformes();
        }

        function cerrarSesion() { location.reload(); }

        function parseItems(v) {
            try {
                return typeof v.items_json === 'string' ? JSON.parse(v.items_json || '[]') : (v.items_json || []);
            } catch (e) { return []; }
        }

        function clasificarCilindro(nombre) {
            let n = String(nombre || '').toLowerCase();
            if (n.includes('100')) return '100';
            if (n.includes('80')) return '80';
            if (n.includes('40')) return '40';
            if (n.includes('30') || n.includes('33')) return '30';
            return 'otro';
        }

        // ================= PROCESAMIENTO DE DATOS =================
        function procesarInformes() {
            let desde = document.getElementById('fecha-desde').value;
            let hasta = document.getElementById('fecha-hasta').value;
            if (!desde || !hasta) return Swal.fire('Atención', 'Selecciona Fecha Desde y Fecha Hasta.', 'warning');

            calcularInformeVentas(desde, hasta);
            calcularInformeBodega(desde, hasta);
            renderPreviewVentas();
            renderPreviewBodega();
        }

        function calcularInformeVentas(desde, hasta) {
            let vtas = (db.ventas || []).filter(v => {
                let f = soloFecha(v.fecha || v.fecha_hora);
                return f >= desde && f <= hasta;
            });

            let gastos = (db.gastos || []).filter(g => {
                let f = soloFecha(g.fecha);
                return f >= desde && f <= hasta;
            }).sort((a, b) => soloFecha(a.fecha).localeCompare(soloFecha(b.fecha)));

            // 1. Ventas diarias
            let mapaDias = {};
            let mapaVend = {};
            let totDia = { c30: 0, c40: 0, c80: 0, c100: 0, unds: 0, ef: 0, bancos: 0, total: 0 };

            vtas.forEach(v => {
                let f = soloFecha(v.fecha || v.fecha_hora);
                if (!mapaDias[f]) mapaDias[f] = { fecha: f, c30: 0, c40: 0, c80: 0, c100: 0, unds: 0, ef: 0, bancos: 0, total: 0 };

                let vend = (v.repartidor_nombre && String(v.repartidor_nombre).trim() !== '') ? String(v.repartidor_nombre).trim() : 'Ventanilla / Patio';
                if (!mapaVend[vend]) mapaVend[vend] = { vendedor: vend, c30: 0, c40: 0, c80: 0, c100: 0, unds: 0, total: 0 };

                let ef = Number(v.pago_efectivo || 0);
                let bancos = Number(v.pago_nequi || 0) + Number(v.pago_transf || 0);
                let tot = Number(v.total || 0);

                mapaDias[f].ef += ef;
                mapaDias[f].bancos += bancos;
                mapaDias[f].total += tot;

                totDia.ef += ef;
                totDia.bancos += bancos;
                totDia.total += tot;

                mapaVend[vend].total += tot;

                parseItems(v).forEach(it => {
                    let cant = Number(it.cantidad || 0);
                    let tipo = clasificarCilindro(it.producto_nombre);
                    if (tipo === '30') { mapaDias[f].c30 += cant; mapaVend[vend].c30 += cant; totDia.c30 += cant; }
                    if (tipo === '40') { mapaDias[f].c40 += cant; mapaVend[vend].c40 += cant; totDia.c40 += cant; }
                    if (tipo === '80') { mapaDias[f].c80 += cant; mapaVend[vend].c80 += cant; totDia.c80 += cant; }
                    if (tipo === '100') { mapaDias[f].c100 += cant; mapaVend[vend].c100 += cant; totDia.c100 += cant; }
                    mapaDias[f].unds += cant;
                    mapaVend[vend].unds += cant;
                    totDia.unds += cant;
                });
            });

            let filasDias = Object.values(mapaDias).sort((a, b) => a.fecha.localeCompare(b.fecha));
            let filasVend = Object.values(mapaVend).sort((a, b) => b.total - a.total);
            let totalGastos = gastos.reduce((acc, g) => acc + Number(g.monto || 0), 0);

            datosVentas = {
                desde, hasta,
                emision: hoyISO(),
                filasDias,
                totDia,
                filasVend,
                gastos,
                totalGastos,
                saldoNeto: totDia.total - totalGastos
            };
        }

        function calcularInformeBodega(desde, hasta) {
            let productos = (db.productos || []).filter(p => p.activo === 'SI');
            let movs = (db.movimientos || []);
            let ventas = (db.ventas || []);

            let resumen = productos.map(p => {
                let finLlenos = Number(p.stock_llenos || 0);
                let finVacios = Number(p.stock_vacios || 0);

                // Revertir movimientos posteriores a "hasta" para obtener saldo al cierre del periodo
                movs.forEach(m => {
                    let f = soloFecha(m.fecha_hora);
                    if (f > hasta && (m.producto_id === p.id || m.producto_nombre === p.nombre)) {
                        let cant = Number(m.cantidad || 0);
                        if (m.tipo === 'INGRESO') finLlenos -= cant;
                        if (m.tipo === 'SALIDA_VACIOS') finVacios += cant;
                    }
                });

                ventas.forEach(v => {
                    let f = soloFecha(v.fecha || v.fecha_hora);
                    if (f > hasta) {
                        parseItems(v).forEach(it => {
                            if (it.producto_id === p.id || it.producto_nombre === p.nombre) {
                                let cant = Number(it.cantidad || 0);
                                finLlenos += cant;
                                finVacios -= cant;
                            }
                        });
                    }
                });

                finLlenos = Math.max(0, finLlenos);
                finVacios = Math.max(0, finVacios);

                // Movimientos dentro del periodo
                let entLlenos = 0, salVacios = 0, vendidos = 0;
                movs.forEach(m => {
                    let f = soloFecha(m.fecha_hora);
                    if (f >= desde && f <= hasta && (m.producto_id === p.id || m.producto_nombre === p.nombre)) {
                        let cant = Number(m.cantidad || 0);
                        if (m.tipo === 'INGRESO') entLlenos += cant;
                        if (m.tipo === 'SALIDA_VACIOS') salVacios += cant;
                    }
                });

                ventas.forEach(v => {
                    let f = soloFecha(v.fecha || v.fecha_hora);
                    if (f >= desde && f <= hasta) {
                        parseItems(v).forEach(it => {
                            if (it.producto_id === p.id || it.producto_nombre === p.nombre) {
                                vendidos += Number(it.cantidad || 0);
                            }
                        });
                    }
                });

                let iniLlenos = Math.max(0, finLlenos - entLlenos + vendidos);
                let iniVacios = Math.max(0, finVacios - vendidos + salVacios);

                return {
                    nombre: p.nombre,
                    iniLlenos, iniVacios,
                    entLlenos, vendidos, salVacios,
                    finLlenos, finVacios
                };
            });

            let totRes = resumen.reduce((a, r) => ({
                iniLlenos: a.iniLlenos + r.iniLlenos,
                iniVacios: a.iniVacios + r.iniVacios,
                entLlenos: a.entLlenos + r.entLlenos,
                vendidos: a.vendidos + r.vendidos,
                salVacios: a.salVacios + r.salVacios,
                finLlenos: a.finLlenos + r.finLlenos,
                finVacios: a.finVacios + r.finVacios
            }), { iniLlenos: 0, iniVacios: 0, entLlenos: 0, vendidos: 0, salVacios: 0, finLlenos: 0, finVacios: 0 });

            let movsPeriodo = movs.filter(m => {
                let f = soloFecha(m.fecha_hora);
                return f >= desde && f <= hasta && (m.tipo === 'INGRESO' || m.tipo === 'SALIDA_VACIOS');
            }).sort((a, b) => String(a.fecha_hora).localeCompare(String(b.fecha_hora)));

            let prestamos = (db.creditos || []).filter(c => {
                let f = soloFecha(c.fecha_registro);
                return (c.estado !== 'LIQUIDADO' && c.estado !== 'DEVUELTO') || (f >= desde && f <= hasta);
            });

            datosBodega = {
                desde, hasta,
                emision: hoyISO(),
                resumen, totRes,
                movsPeriodo,
                prestamos
            };
        }

        // ================= VISTAS PREVIAS EN PANTALLA =================
        function renderPreviewVentas() {
            let d = datosVentas;
            let elabora = document.getElementById('firma-elabora').value || '_______________________';
            let aprueba = document.getElementById('firma-aprueba').value || '_______________________';

            let rowsDias = d.filasDias.map(r => `
                <tr class="border-b border-slate-200">
                    <td class="p-1.5 font-bold">${r.fecha}</td>
                    <td class="p-1.5 text-center">${r.c30}</td>
                    <td class="p-1.5 text-center">${r.c40}</td>
                    <td class="p-1.5 text-center">${r.c80}</td>
                    <td class="p-1.5 text-center">${r.c100}</td>
                    <td class="p-1.5 text-center font-bold">${r.unds}</td>
                    <td class="p-1.5 text-right">${formMoneda(r.ef)}</td>
                    <td class="p-1.5 text-right">${formMoneda(r.bancos)}</td>
                    <td class="p-1.5 text-right font-black">${formMoneda(r.total)}</td>
                </tr>`).join('') || '<tr><td colspan="9" class="p-3 text-center text-slate-400">Sin ventas en este periodo.</td></tr>';

            let rowsVend = d.filasVend.map(r => `
                <tr class="border-b border-slate-200">
                    <td class="p-1.5 font-bold">${r.vendedor}</td>
                    <td class="p-1.5 text-center">${r.c30}</td>
                    <td class="p-1.5 text-center">${r.c40}</td>
                    <td class="p-1.5 text-center">${r.c80}</td>
                    <td class="p-1.5 text-center">${r.c100}</td>
                    <td class="p-1.5 text-center font-bold">${r.unds}</td>
                    <td class="p-1.5 text-right font-black">${formMoneda(r.total)}</td>
                </tr>`).join('') || '<tr><td colspan="7" class="p-3 text-center text-slate-400">Sin ventas registradas.</td></tr>';

            let rowsGastos = d.gastos.map(g => `
                <tr class="border-b border-slate-200">
                    <td class="p-1.5">${soloFecha(g.fecha)}</td>
                    <td class="p-1.5 text-center">${g.tipo_gasto || ''}</td>
                    <td class="p-1.5 text-center">${g.origen || ''}</td>
                    <td class="p-1.5">${g.concepto || ''}</td>
                    <td class="p-1.5 text-right font-bold text-rose-700">${formMoneda(g.monto)}</td>
                </tr>`).join('') || '<tr><td colspan="5" class="p-3 text-center text-slate-400">Sin gastos en este periodo.</td></tr>';

            document.getElementById('preview-ventas').innerHTML = `
                <div class="border-b-2 border-[#1e3a8a] pb-3 mb-5 flex justify-between items-start">
                    <div>
                        <h2 class="text-2xl font-black text-[#1e3a8a] leading-none">${EMPRESA.nombre}</h2>
                        <p class="text-xs font-bold text-slate-600 mt-1">${EMPRESA.grupo} • ${EMPRESA.nit}</p>
                        <p class="text-[11px] text-slate-500">${EMPRESA.direccion} | ${EMPRESA.telefono}</p>
                    </div>
                    <div class="text-right">
                        <span class="bg-[#1e3a8a] text-white text-[10px] font-black uppercase px-2.5 py-1 rounded">Informe Consolidado</span>
                        <p class="text-xs font-bold text-slate-700 mt-1.5">Periodo: ${d.desde} al ${d.hasta}</p>
                        <p class="text-[11px] text-slate-500">Emisión: ${d.emision}</p>
                    </div>
                </div>

                <h3 class="text-center font-black text-base text-slate-800 uppercase tracking-wide mb-5">INFORME CONSOLIDADO DE VENTAS Y GASTOS</h3>

                <h4 class="text-xs font-black uppercase text-[#1e3a8a] mb-2">1. Total de Ventas Diarias en el Ciclo</h4>
                <table class="w-full text-[11px] border border-slate-300 mb-5">
                    <thead class="bg-[#1e3a8a] text-white">
                        <tr>

        function crearCelda(texto, { bold = false, align = 'left', fill = null, color = '1E293B', size = 18, colSpan = 1, widthPct = null } = {}) {
            const { TableCell, Paragraph, TextRun, AlignmentType, ShadingType, VerticalAlign, WidthType } = window.docx;
            const mapAlign = { left: AlignmentType.LEFT, center: AlignmentType.CENTER, right: AlignmentType.RIGHT };
            let opts = {
                columnSpan: colSpan,
                verticalAlign: VerticalAlign.CENTER,
                margins: { top: 70, bottom: 70, left: 90, right: 90 },
                children: [
                    new Paragraph({
                        alignment: mapAlign[align] || AlignmentType.LEFT,
                        spacing: { before: 0, after: 0 },
                        children: [new TextRun({ text: String(texto ?? ''), bold, color, size, font: 'Calibri' })]
                    })
                ]
            };
            if (fill) opts.shading = { type: ShadingType.CLEAR, color: 'auto', fill };
            if (widthPct) opts.width = { size: widthPct, type: WidthType.PERCENTAGE };
            return new TableCell(opts);
        }

        function crearTablaWord(headers, filas, footer, alignments, widths, headerFill = '1E3A8A') {
            const { Table, TableRow, WidthType, BorderStyle } = window.docx;
            const border = { style: BorderStyle.SINGLE, size: 4, color: 'CBD5E1' };
            const tableRows = [];

            tableRows.push(new TableRow({
                tableHeader: true,
                children: headers.map((h, i) => crearCelda(h, { bold: true, align: alignments[i], fill: headerFill, color: 'FFFFFF', size: 17, widthPct: widths[i] }))
            }));

            if (filas.length === 0) {
                tableRows.push(new TableRow({
                    children: [crearCelda('Sin registros en el periodo seleccionado.', { align: 'center', color: '64748B', size: 17, colSpan: headers.length })]
                }));
            } else {
                filas.forEach((f, idx) => {
                    let bg = idx % 2 === 1 ? 'F8FAFC' : null;
                    tableRows.push(new TableRow({
                        children: f.map((val, i) => crearCelda(val, { align: alignments[i], fill: bg, size: 17, widthPct: widths[i] }))
                    }));
                });
            }

            if (footer) {
                tableRows.push(new TableRow({
                    children: footer.map((val, i) => crearCelda(val, { bold: true, align: alignments[i], fill: 'E2E8F0', color: '0F172A', size: 17, widthPct: widths[i] }))
                }));
            }

            return new Table({
                width: { size: 100, type: WidthType.PERCENTAGE },
                borders: { top: border, bottom: border, left: border, right: border, insideHorizontal: border, insideVertical: border },
                rows: tableRows
            });
        }

        async function guardarDocx(children, nombreArchivo) {
            const { Document, Packer, PageOrientation } = window.docx;
            const doc = new Document({
                sections: [{
                    properties: {
                        page: {
                            // Tamaño CARTA exacto (8.5 x 11 pulgadas = 12240 x 15840 twips) en orientación VERTICAL
                            size: { width: 12240, height: 15840, orientation: PageOrientation.PORTRAIT },
                            margin: { top: 850, right: 850, bottom: 850, left: 850 }
                        }
                    },
                    children
                }]
            });
            const blob = await Packer.toBlob(doc);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nombreArchivo;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
